<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slideshow</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/frontend/global/css/style.css" />
  <link rel="stylesheet" href="/frontend/pages/index/index.css?v=status-overlay-4" />
</head>

<body>
  <div id="slideshow-container">
    <div id="slide1" class="slideshow-img slide-center"></div>
    <div id="slide2" class="slideshow-img slide-right"></div>
  </div>

  <div id="loading-spinner" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true">
      <span class="spinner-ring spinner-ring-outer"></span>
      <span class="spinner-ring spinner-ring-inner"></span>
      <svg class="spinner-core" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M12 3v8M7 5.7a8 8 0 1 0 10 0" />
      </svg>
    </div>
    <div class="spinner-copy">
      <span class="spinner-title">Connecting to your PC</span>
      <span class="spinner-subtitle">Getting things ready<span class="spinner-dots" aria-hidden="true"><i></i><i></i><i></i></span></span>
    </div>
  </div>

  <div id="status-overlay" aria-hidden="false">
    <div class="status-clock">
      <div class="status-time-row">
        <span id="status-time">00:00</span>
        <span id="status-seconds">00</span>
      </div>
    </div>
    <div class="status-details">
      <div id="status-date">Monday, 1 January</div>
      <div class="status-grid">
        <div class="status-item">
          <span class="status-label">Week</span>
          <span id="status-week">--</span>
        </div>
        <div class="status-item">
          <span class="status-label">PC</span>
          <span id="status-pc">Checking</span>
        </div>
      </div>
    </div>
  </div>

  <script src="/frontend/config-default.js"></script>
  <script src="/frontend/config.js"></script>
  <script src="/frontend/pages/index/index.js?v=status-overlay-4"></script>
</body>

</html>
